<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Accent Gradient for Focus Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
  </defs>

  <!-- Solid background edge-to-edge with no border radius -->
  <rect width="512" height="512" fill="#0d1117" />

  <!-- Focus Orbit Ring (Pomodoro Rhythm) - Increased radius to 170 for bold presence -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="13" stroke-dasharray="26 17" stroke-linecap="round" opacity="0.85" />

  <!-- 4 Pomodoro Phase Quadrant Dots -->
  <circle cx="256" cy="86" r="9" fill="#818cf8" />
  <circle cx="426" cy="256" r="9" fill="#6366f1" />
  <circle cx="256" cy="426" r="9" fill="#38bdf8" />
  <circle cx="86" cy="256" r="9" fill="#34d399" />

  <!-- Bold Precision Checkmark (Clean Sharp Vector) -->
  <path
    d="M 162 263 L 229 330 L 354 187"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Active Rhythm Spark -->
  <circle cx="372" cy="169" r="11" fill="#38bdf8" />
</svg>
